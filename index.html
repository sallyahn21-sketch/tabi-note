*{box-sizing:border-box}body{margin:0;background:#eee8dc;color:#494238;font:16px system-ui,sans-serif}main{max-width:760px;margin:auto;min-height:100vh;background:#faf6ed;padding:24px 22px 110px}header{border-bottom:1px solid #cfc3af;padding-bottom:15px;letter-spacing:3px;color:#65785c;font-family:serif}h1,h2{font-family:serif;font-weight:500}small{color:#817665;letter-spacing:1px}button,input,textarea,select{font:inherit}button{cursor:pointer;border:0;border-radius:8px;background:#e4e8dc;color:#46563d;padding:12px}input,textarea,select{width:100%;padding:12px;border:1px solid #d7cdbd;border-radius:6px;background:#fffdf8;margin:6px 0;color:inherit}textarea{min-height:100px}article{background:#fffdf8;border:1px solid #ded6c8;padding:16px;margin:12px 0;border-radius:8px}nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(100%,760px);display:grid;grid-template-columns:repeat(5,1fr);background:#f5f0e6;border-top:1px solid #cfc3af;padding:8px 4px calc(8px + env(safe-area-inset-bottom));z-index:2}nav button{background:none;font-size:12px;padding:4px 0;display:grid;justify-items:center;gap:4px}nav b{font-size:24px;height:42px;display:grid;place-items:center;font-weight:400}nav button:nth-child(3) b{background:#344b3e;color:white;border-radius:50%;width:42px}nav .active{color:#425d38;font-weight:bold}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.days{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}.days button{padding:10px 0}.selected{background:#344b3e;color:white}.hero{text-align:center;padding:25px 0}.hero svg{width:100%;max-height:220px;background:#e9e6d7;border:8px solid #fffdf8;box-shadow:0 2px 5px #d5cbb9}.line{display:flex;align-items:center;gap:10px;justify-content:space-between}.line input{width:auto}.muted{color:#817665;font-size:13px}.danger{background:#f1e3df;color:#80564d;padding:7px}.wide{width:100%}a{color:#52654a}progress{width:100%;accent-color:#344b3e}.passport{text-align:center;background:#344b3e;color:#e2 const $=id=>document.getElementById(id), esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let data={};try{data=JSON.parse(localStorage.getItem('tabi-v02')||'{}')}catch{};data.lists??={};data.notes??={};data.pack??=['여권','항공권','숙소 예약 확인서','충전기','보조배터리','겨울 외투','엔화 및 결제 카드'].map(t=>({t,done:false}));let page='홈',day=0;const tabs=['일정','지도','홈','교통정보','전체'],icons=['▤','♧','⌂','▣','☰'],menus=['일정','여행지','지도','교통정보','숙소','예약','준비물','경비','쇼핑','코난','기록','설정'];const hotels=[];function save(){try{localStorage.setItem('tabi-v02',JSON.stringify(data))}catch{alert('저장할 수 없는 환경입니다. 설정에서 백업하세요.')}}function go(p){page=p;render()}function choose(i){day=i;render()}function list(k){return data.lists[k]??=[]}function add(k){let t=$('entry').value.trim();if(!t)return;let amount=Number($('amount')?.value||0);list(k).push({t,amount});save();render()}function del(k,i){list(k).splice(i,1);save();render()}function edit(k,i){let t=prompt('내용 수정',list(k)[i].t);if(t!==null&&t.trim()){list(k)[i].t=t.trim();save();render()}}function rows(k){return list(k).map((r,i)=>`<article class="line"><span>${esc(r.t)} ${r.amount?' · ¥'+r.amount.toLocaleString():''}</span><span><button onclick="edit('${k}',${i})">수정</button> <button class="danger" onclick="del('${k}',${i})">삭제</button></span></article>`).join('')}function editor(k){return rows(k)+`<input id="entry" placeholder="${k==='경비'?'지출 내용':'내용 입력'}">${k==='경비'?'<input id="amount" type="number" min="0" placeholder="금액 (엔)">':''}<button class="wide" onclick="add('${k}')">추가하기</button>`}function map(){let dest=$('dest').value.trim(),origin=$('origin').value.trim();if(!dest)return;let url='https://www.google.com/maps/dir/?api=1&destination='+encodeURIComponent(dest)+'&travelmode='+$('mode').value+(origin?'&origin='+encodeURIComponent(origin):'');window.open(url,'_blank','noopener')}function packAdd(){let t=$('entry').value.trim();if(t){data.pack.push({t,done:false});save();render()}}function backup(){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(data)],{type:'application/json'}));a.download='tabi-backup.json';a.click();URL.revokeObjectURL(a.href)}function restore(f){if(!f)return;f.text().then(t=>{let d=JSON.parse(t);if(!Array.isArray(d.pack)||!d.lists||!d.notes)throw Error();data=d;save();render()}).catch(()=>alert('올바른 백업 파일이 아닙니다.'))}let region=0;function goRegion(i){region=i;go("지역 여행지")}function render(){ $('nav').innerHTML=tabs.map((t,i)=>`<button class="${page===t?'active':''}" onclick="go('${t}')"><b>${icons[i]}</b>${t}</button>`).join('');let h=`<small>TRAVEL JOURNAL / ${esc(page)}</small><h1>${esc(page)}</h1>`;if(page==='홈'){let diff=data.departure?Math.round((Date.parse(data.departure+'T00:00:00Z')-Date.UTC(new Date().getFullYear(),new Date().getMonth(),new Date().getDate()))/86400000):null;h=`<div class="passport"><small>PERSONAL TRAVEL JOURNAL</small><h1>T A B I  N O T E</h1><p>旅 の 記 録</p><svg viewBox="0 0 160 140" width="130" aria-hidden="true"><g stroke="currentColor" fill="none" stroke-width="1.5"><circle cx="80" cy="70" r="59"/><circle cx="80" cy="70" r="53" stroke-dasharray="2 3"/><path d="M28 99L65 42L89 75L108 54L135 99Z M52 62L65 42L78 61 M40 108H120"/><circle cx="107" cy="38" r="11"/></g></svg><h2>TRAVEL PASSPORT</h2><small>JAPAN · 2026</small></div><article><small>TRAVEL INFORMATION · PAGE 01</small><h2>日本 JAPAN</h2><p>OSAKA · KYOTO · TOTTORI</p><label>출발일<input type="date" value="${esc(data.departure||'')}" onchange="data.departure=this.value;save();render()"></label><label>귀국일<input type="date" value="${esc(data.returnDate||'')}" onchange="data.returnDate=this.value;save();render()"></label><div class="line"><h2>${diff===null?'출발일 설정':diff===0?'D-DAY':diff>0?'D-'+diff:'D+'+(-diff)}</h2><span class="departure">DEPARTURE<br>JAPAN</span></div></article><small>PAGE 02 · 旅の足跡</small><h2>Journey Stamps</h2><div class="grid stamps">${[['OSAKA','大阪','오사카','#657f69','M20 65H80 M28 65V53H72V65 M20 53L50 40L80 53Z M34 40V30H66V40 M27 30L50 18L73 30Z'],['KYOTO','京都','교토','#a87568','M20 20Q50 28 80 20L77 28H23Z M26 36H74 M34 28V70 M66 28V70 M34 49H66'],['TOTTORI','鳥取','돗토리','#687e90','M65 55L80 70 M65 55A22 22 0 1 0 34 24A22 22 0 0 0 65 55']].map((a,i)=>`<div class="stampwrap"><button class="stamp" style="color:${a[3]}" onclick="goRegion(${i})"><b>${a[0]}</b><svg viewBox="0 0 100 80" aria-hidden="true"><path d="${a[4]}" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linejoin="round"/></svg><strong>${a[1]}</strong><small>${a[2]}</small></button><label class="visit"><input type="checkbox" ${data.visited?.[i]?'checked':''} onchange="(data.visited??={})[${i}]=this.checked;save()"> 방문 완료</label></div>`).join('')}</div><h2>Travel Documents</h2><div class="grid documents">${[['항공권','BOARDING PASS'],['숙소','HOTEL VOUCHER'],['준비물','PACKING LIST'],['예약','TICKET BOOK'],['경비','TRAVEL BUDGET'],['코난','DETECTIVE FILE']].map(a=>`<button onclick="go('${a[0]}')">${a[0]}<small>${a[1]}</small></button>`).join('')}</div><article><h2>Travel Memo</h2><textarea placeholder="여행 메모" oninput="data.homeMemo=this.value;save()">${esc(data.homeMemo||'')}</textarea></article>`}else if(page==='전체'){h+='<div class="grid">'+menus.map(m=>`<button onclick="go('${m}')">${m}</button>`).join('')+'</div>'}else if(page==='일정'){h+='<div class="days">'+Array.from({length:7},(_,i)=>`<button class="${day===i?'selected':''}" onclick="choose(${i})">DAY ${i+1}</button>`).join('')+'</div><h2>DAY '+(day+1)+'</h2><p>'+'여행 일정'+'</p>'+editor('day'+day)}else if(page==='지역 여행지'){h+='<h2>'+['오사카','교토','돗토리'][region]+'</h2>'+editor('region'+region)}else if(page==='숙소'){h+=editor('숙소')}else if(page==='준비물'){h+=`<progress max="${data.pack.length||1}" value="${data.pack.filter(x=>x.done).length}"></progress>`+data.pack.map((x,i)=>`<article class="line"><label><input type="checkbox" ${x.done?'checked':''} onchange="data.pack[${i}].done=this.checked;save();render()"> ${esc(x.t)}</label><button class="danger" onclick="data.pack.splice(${i},1);save();render()">삭제</button></article>`).join('')+'<input id="entry" placeholder="준비물"><button onclick="packAdd()">추가</button>'}else if(page==='기록'){h+='<select onchange="choose(Number(this.value))">'+Array.from({length:7},(_,i)=>`<option value="${i}" ${i===day?'selected':''}>DAY ${i+1}</option>`).join('')+`</select><textarea placeholder="오늘의 기억" oninput="data.notes[day]=this.value;save()">${esc(data.notes[day])}</textarea>`}else if(page==='지도'||page==='교통정보'){h+='<article><input id="origin" placeholder="출발지 (비우면 현재 위치)"><input id="dest" placeholder="목적지"><select id="mode"><option value="transit">전철·버스</option><option value="walking">도보</option></select><button class="wide" onclick="map()">Google 지도에서 길 찾기</button><p class="muted">외부 지도에서 실제 경로를 확인합니다.</p></article>';if(page==='교통정보')h+=editor('교통정보')}else if(page==='설정'){h+='<article>Version 0.5 · 기기 내 저장<br><button onclick="backup()">백업 파일 저장</button><p>백업 복원</p><input type="file" accept=".json" onchange="restore(this.files[0])"></article>'}else{if(page==='경비')h+='<h2>총 ¥'+list(page).reduce((s,r)=>s+r.amount,0).toLocaleString()+'</h2>';h+=editor(page)}$('view').innerHTML=h}
const schemas={
'일정':[['start','시작','time'],['end','종료','time'],['category','분류','text'],['place','장소','text'],['memo','메모','text']],
'여행지':[['region','지역','text'],['jp','일본어 명칭','text'],['address','주소','text'],['station','가까운 역','text'],['hours','운영시간','text'],['fee','입장료','text'],['memo','메모','text']],
'숙소':[['checkin','체크인','date'],['checkout','체크아웃','date'],['room','객실','text'],['address','주소','text'],['booking','예약번호','text'],['memo','메모','text']],
'예약':[['date','예약일','date'],['time','시간','time'],['booking','예약번호','text'],['url','공식 링크','url'],['memo','메모','text']],
'경비':[['date','날짜','date'],['category','분류','text'],['amount','금액','number'],['currency','통화 (JPY / KRW)','text'],['payment','결제수단','text'],['memo','메모','text']],
'쇼핑':[['region','지역','text'],['brand','브랜드','text'],['amount','예상 가격 (엔)','number'],['store','매장','text'],['memo','메모','text']],
'코난':[['region','지역','text'],['work','관련 작품','text'],['address','주소','text'],['scene','등장 장면','text'],['url','참고 링크','url'],['memo','메모','text']],
'교통정보':[['type','교통수단 / 패스','text'],['date','이용일','date'],['amount','금액 (엔)','number'],['memo','메모','text']]};
let editing=-1;const oldGo=go;go=function(p){editing=-1;oldGo(p)};const oldChoose=choose;choose=function(i){editing=-1;oldChoose(i)};
function rich(k,schema){let r=editing<0?{}:list(k)[editing]||{};return list(k).map((x,i)=>`<article><div class="line"><label><input type="checkbox" ${x.done?'checked':''} onchange="list('${k}')[${i}].done=this.checked;save();render()"> <strong>${esc(x.t)}</strong></label><button onclick="editing=${i};render()">수정</button></div>${schema.filter(a=>x[a[0]]!==undefined&&x[a[0]]!=='').map(a=>`<p class="muted">${a[1]}: ${esc(x[a[0]])}</p>`).join('')}<div class="line"><button onclick="moveRow('${k}',${i},-1)">↑</button><button onclick="moveRow('${k}',${i},1)">↓</button><button class="danger" onclick="if(confirm('삭제할까요?')){editing=-1;del('${k}',${i})}">삭제</button></div></article>`).join('')+`<article><h2>${editing<0?'새 항목':'항목 수정'}</h2><label>이름<input id="richName" value="${esc(r.t||'')}"></label>${schema.map(a=>`<label>${a[1]}<input id="field_${a[0]}" type="${a[2]}" value="${esc(r[a[0]]??'')}"></label>`).join('')}<button class="wide" onclick="richSave('${k}')">저장</button>${editing<0?'':'<button onclick="editing=-1;render()">취소</button>'}</article>`}
function richSave(k){let t=$('richName').value.trim();if(!t)return;let r={...(editing<0?{}:list(k)[editing]),t};for(let a of schemas[page==='지역 여행지'?'여행지':page]){let v=$('field_'+a[0]).value;r[a[0]]=a[2]==='number'?Number(v)||0:v}if(editing<0)list(k).push(r);else list(k)[editing]=r;editing=-1;save();render()}
function moveRow(k,i,d){let a=list(k),j=i+d;if(j<0||j>=a.length)return;[a[i],a[j]]=[a[j],a[i]];editing=-1;save();render()}
const originalEditor=editor;editor=function(k){let schema=schemas[page==='지역 여행지'?'여행지':page];return schema?rich(k,schema):originalEditor(k)};
const originalRender=render;render=function(){originalRender();if(page==='경비'){let h=$('view').querySelector('h2');if(h){let totals={JPY:0,KRW:0};for(let r of list('경비'))totals[r.currency==='KRW'?'KRW':'JPY']+=Number(r.amount)||0;h.textContent='합계 ¥'+totals.JPY.toLocaleString()+' / ₩'+totals.KRW.toLocaleString()}}if(page==='설정'){$('view').insertAdjacentHTML('beforeend','<article><h2>업데이트 안내</h2><p>v0.5 · 상세 입력 및 완료 체크, 순서 변경 지원. 외부 API 및 동기화는 아직 연결되지 않았습니다.</p></article>')}};
