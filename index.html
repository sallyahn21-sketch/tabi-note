<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>TABI NOTE</title><link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#78896e"><meta name="apple-mobile-web-app-capable" content="yes"><link rel="apple-touch-icon" href="icon-192.png"><style>
*{box-sizing:border-box}body{margin:0;background:#eee8dc;color:#494238;font:16px system-ui,sans-serif}main{max-width:760px;margin:auto;min-height:100vh;background:#faf6ed;padding:24px 22px 110px}header{border-bottom:1px solid #cfc3af;padding-bottom:15px;letter-spacing:3px;color:#65785c;font-family:serif}h1,h2{font-family:serif;font-weight:500}small{color:#817665;letter-spacing:1px}button,input,textarea,select{font:inherit}button{cursor:pointer;border:0;border-radius:8px;background:#e4e8dc;color:#46563d;padding:12px}input,textarea,select{width:100%;padding:12px;border:1px solid #d7cdbd;border-radius:6px;background:#fffdf8;margin:6px 0;color:inherit}textarea{min-height:100px}article{background:#fffdf8;border:1px solid #ded6c8;padding:16px;margin:12px 0;border-radius:8px}nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(100%,760px);display:grid;grid-template-columns:repeat(5,1fr);background:#f5f0e6;border-top:1px solid #cfc3af;padding:8px 4px calc(8px + env(safe-area-inset-bottom));z-index:2}nav button{background:none;font-size:12px;padding:4px 0;display:grid;justify-items:center;gap:4px}nav b{font-size:24px;height:42px;display:grid;place-items:center;font-weight:400}nav button:nth-child(3) b{background:#78896e;color:white;border-radius:50%;width:42px}nav .active{color:#425d38;font-weight:bold}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.days{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}.days button{padding:10px 0}.selected{background:#78896e;color:white}.hero{text-align:center;padding:25px 0}.hero svg{width:100%;max-height:220px;background:#e9e6d7;border:8px solid #fffdf8;box-shadow:0 2px 5px #d5cbb9}.line{display:flex;align-items:center;gap:10px;justify-content:space-between}.line input{width:auto}.muted{color:#817665;font-size:13px}.danger{background:#f1e3df;color:#80564d;padding:7px}.wide{width:100%}a{color:#52654a}progress{width:100%;accent-color:#78896e}</style><main><header>旅 &nbsp; TABI NOTE <small> / TRAVEL JOURNAL</small></header><section id="view"></section></main><nav id="nav"></nav><script>
const $=id=>document.getElementById(id), esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let data={};try{data=JSON.parse(localStorage.getItem('tabi-v02')||'{}')}catch{};data.lists??={};data.notes??={};data.pack??=['여권','항공권','숙소 예약 확인서','충전기','보조배터리','겨울 외투','엔화 및 결제 카드'].map(t=>({t,done:false}));let page='홈',day=0;const tabs=['일정','지도','홈','교통정보','전체'],icons=['▤','♧','⌂','▣','☰'],menus=['일정','여행지','지도','교통정보','숙소','예약','준비물','경비','쇼핑','코난','기록','설정'];const hotels=[];function save(){try{localStorage.setItem('tabi-v02',JSON.stringify(data))}catch{alert('저장할 수 없는 환경입니다. 설정에서 백업하세요.')}}function go(p){page=p;render()}function choose(i){day=i;render()}function list(k){return data.lists[k]??=[]}function add(k){let t=$('entry').value.trim();if(!t)return;let amount=Number($('amount')?.value||0);list(k).push({t,amount});save();render()}function del(k,i){list(k).splice(i,1);save();render()}function edit(k,i){let t=prompt('내용 수정',list(k)[i].t);if(t!==null&&t.trim()){list(k)[i].t=t.trim();save();render()}}function rows(k){return list(k).map((r,i)=>`<article class="line"><span>${esc(r.t)} ${r.amount?' · ¥'+r.amount.toLocaleString():''}</span><span><button onclick="edit('${k}',${i})">수정</button> <button class="danger" onclick="del('${k}',${i})">삭제</button></span></article>`).join('')}function editor(k){return rows(k)+`<input id="entry" placeholder="${k==='경비'?'지출 내용':'내용 입력'}">${k==='경비'?'<input id="amount" type="number" min="0" placeholder="금액 (엔)">':''}<button class="wide" onclick="add('${k}')">추가하기</button>`}function map(){let dest=$('dest').value.trim(),origin=$('origin').value.trim();if(!dest)return;let url='https://www.google.com/maps/dir/?api=1&destination='+encodeURIComponent(dest)+'&travelmode='+$('mode').value+(origin?'&origin='+encodeURIComponent(origin):'');window.open(url,'_blank','noopener')}function packAdd(){let t=$('entry').value.trim();if(t){data.pack.push({t,done:false});save();render()}}function backup(){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(data)],{type:'application/json'}));a.download='tabi-backup.json';a.click();URL.revokeObjectURL(a.href)}function restore(f){if(!f)return;f.text().then(t=>{let d=JSON.parse(t);if(!Array.isArray(d.pack)||!d.lists||!d.notes)throw Error();data=d;save();render()}).catch(()=>alert('올바른 백업 파일이 아닙니다.'))}function render(){ $('nav').innerHTML=tabs.map((t,i)=>`<button class="${page===t?'active':''}" onclick="go('${t}')"><b>${icons[i]}</b>${t}</button>`).join('');let h=`<small>TRAVEL JOURNAL / ${esc(page)}</small><h1>${esc(page)}</h1>`;if(page==='홈'){let now=new Date(),diff=Math.round((Date.UTC(now.getFullYear(),now.getMonth(),now.getDate())-Date.UTC(now.getFullYear(),now.getMonth(),now.getDate()))/86400000);h=`<div class="hero"><small>冬の旅 · MY JOURNEY</small><h1>우리의 여행</h1><p>나만의 여행 다이어리</p><svg viewBox="0 0 400 190" aria-label="일본 겨울 풍경 일러스트"><circle cx="305" cy="42" r="26" fill="#c99b90"/><path d="M0 145 L110 45 180 125 240 75 400 155 V190 H0Z" fill="#b8c1ad"/><path d="M0 165 Q120 120 240 165 T400 155 V190 H0" fill="#87977c"/><g fill="#65584b"><path d="M145 170V85H195V170Z M135 85L170 55 205 85Z M130 115L170 95 210 115Z M125 145L170 125 215 145Z"/></g></svg><p class="muted">소중한 순간들을 한 페이지씩.</p></div><article class="line"><h2>Travel notes</h2><span>여행 플래너</span></article><h2>Our Journey</h2>${hotels.map((a,i)=>`<article class="line" onclick="day=${i*2};go('일정')"><small>${a[1]}</small><b>${i===1?'교토':'오사카'}</b><span>›</span></article>`).join('')}<button class="wide" onclick="go('준비물')">준비물 ${data.pack.filter(x=>x.done).length}/${data.pack.length}</button>`}else if(page==='전체'){h+='<div class="grid">'+menus.map(m=>`<button onclick="go('${m}')">${m}</button>`).join('')+'</div>'}else if(page==='일정'){h+='<div class="days">'+Array.from({length:7},(_,i)=>`<button class="${day===i?'selected':''}" onclick="choose(${i})">DAY ${i+1}</button>`).join('')+'</div><h2>DEC. '+(11+day)+' · DAY '+(day+1)+'</h2><p>'+'여행 일정'+'</p>'+editor('day'+day)}else if(page==='숙소'){h+=editor('숙소')}else if(page==='준비물'){h+=`<progress max="${data.pack.length||1}" value="${data.pack.filter(x=>x.done).length}"></progress>`+data.pack.map((x,i)=>`<article class="line"><label><input type="checkbox" ${x.done?'checked':''} onchange="data.pack[${i}].done=this.checked;save();render()"> ${esc(x.t)}</label><button class="danger" onclick="data.pack.splice(${i},1);save();render()">삭제</button></article>`).join('')+'<input id="entry" placeholder="준비물"><button onclick="packAdd()">추가</button>'}else if(page==='기록'){h+='<select onchange="choose(Number(this.value))">'+Array.from({length:7},(_,i)=>`<option value="${i}" ${i===day?'selected':''}>DAY ${i+1}</option>`).join('')+`</select><textarea placeholder="오늘의 기억" oninput="data.notes[day]=this.value;save()">${esc(data.notes[day])}</textarea>`}else if(page==='지도'||page==='교통정보'){h+='<article><input id="origin" placeholder="출발지 (비우면 현재 위치)"><input id="dest" placeholder="목적지"><select id="mode"><option value="transit">전철·버스</option><option value="walking">도보</option></select><button class="wide" onclick="map()">Google 지도에서 길 찾기</button><p class="muted">외부 지도에서 실제 경로를 확인합니다.</p></article>';if(page==='교통정보')h+=editor('교통정보')}else if(page==='설정'){h+='<article>Version 0.3 · 기기 내 저장<br><button onclick="backup()">백업 파일 저장</button><p>백업 복원</p><input type="file" accept=".json" onchange="restore(this.files[0])"></article>'}else{if(page==='경비')h+='<h2>총 ¥'+list(page).reduce((s,r)=>s+r.amount,0).toLocaleString()+'</h2>';h+=editor(page)}$('view').innerHTML=h}render();</script><script>if ("serviceWorker" in navigator && location.protocol.startsWith("http")) navigator.serviceWorker.register("./sw.js").catch(console.error);</script></html>
